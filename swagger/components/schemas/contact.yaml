type: object
required:
  - _id
  - name
  - phoneNumber
  - isFavourite
  - contactType
  - userId
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 66b89fca299021689d12755a
  name:
    description: "Contact's name"
    type: string
    example: 'Ivan Ivanenko'
  phoneNumber:
    description: "Contact's phonenumber"
    type: string
    example: '+380000000009'
  isFavourite:
    description: 'Is contact favourite?'
    type: boolean
    default: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    default: 'personal'
    example: work
  userId:
    description: "Contact's parent id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    type: String,
    default: null,
